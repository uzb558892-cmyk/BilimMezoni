<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILIM MEZONI - Arab tili va CEFR</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #3498db; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; }
        .btn:hover { background: #2980b9; }
        .form-group { margin-top: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        #login-modal { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .error { color: #e74c3c; margin-top: 10px; }
        .success { color: #27ae60; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BILIM MEZONI</h1>
        <p>Arab tili va CEFR imtihonlariga tayyorgarlik ko'rish uchun zamonaviy onlayn platformaga xush kelibsiz!</p>
        <button class="btn" onclick="toggleLogin()">Tizimga kirish</button>

        <div id="login-modal">
            <h3>Tizimga kirish</h3>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="Email kiriting">
            </div>
            <div class="form-group">
                <label>Parol:</label>
                <input type="password" id="password" placeholder="Parolni kiriting">
            </div>
            <button class="btn" onclick="handleLogin()">Kirish</button>
            <div id="message"></div>
        </div>
    </div>

    <script>
        // Supabase ulanishi
        const SUPABASE_URL = 'https://pnmvbmcknxqhxrvckbgy.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_b_7uJ7RhH23kxKS9zEaWJg_sFgi4FJW';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleLogin() {
            const modal = document.getElementById('login-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('message');

            msgDiv.innerHTML = "Tekshirilmoqda...";
            msgDiv.className = "";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                msgDiv.innerHTML = "Xatolik: " + error.message;
                msgDiv.className = "error";
            } else {
                msgDiv.innerHTML = "Muvaffaqiyatli kirildi! Xush kelibsiz, " + data.user.email;
                msgDiv.className = "success";
            }
        }
    </script>
</body>
</html>
